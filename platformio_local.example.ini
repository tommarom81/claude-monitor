; Copy to platformio_local.ini (gitignored) to flash the mini-s3-35 over WiFi.
; Needs OTA_PASS set in src/mqtt_local.h and one USB flash of a build that has it.
; Run: pio run -e mini-s3-35-ota -t upload
[env:mini-s3-35-ota]
extends = env:mini-s3-35
upload_protocol = espota
upload_port = 192.168.1.50
upload_flags = --auth=change-me-too
