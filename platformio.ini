[env:tdisplay-s3]
platform = espressif32@6.9.0
board = lilygo-t-display-s3
framework = arduino
monitor_speed = 115200
upload_speed = 921600
board_build.filesystem = spiffs
; 16MB chip (the board default); the 4MB table capped the app at 1.25MB, which
; v3 outgrew. Flash offsets of the 4 web-flasher artifacts are identical in
; both tables and NVS stays at 0x9000, so settings survive a reflash.
board_build.partitions = default_16MB.csv
board_build.arduino.memory_type = qio_opi

lib_deps =
    bodmer/TFT_eSPI@^2.5.0
    bblanchon/ArduinoJson@^7.0.0

build_flags =
    -DBOARD_TDISPLAY_S3
    -DMANGO_UI
    -DDUST_UI
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DUSER_SETUP_LOADED
    -DST7789_DRIVER
    -DTFT_PARALLEL_8_BIT
    -DTFT_WIDTH=170
    -DTFT_HEIGHT=320
    -DTFT_CS=6
    -DTFT_DC=7
    -DTFT_RST=5
    -DTFT_WR=8
    -DTFT_RD=9
    -DTFT_D0=39
    -DTFT_D1=40
    -DTFT_D2=41
    -DTFT_D3=42
    -DTFT_D4=45
    -DTFT_D5=46
    -DTFT_D6=47
    -DTFT_D7=48
    -DTFT_BL=38
    -DTFT_BACKLIGHT_ON=HIGH
    -DLOAD_GLCD
    -DLOAD_FONT2
    -DLOAD_FONT4
    -DLOAD_GFXFF
    -DCORE_DEBUG_LEVEL=1

; LilyGo T-Display S3 AMOLED (1.91" RM67162, e.g. H712/H713/H705/H681/H717 variants)
; Display is auto-detected at runtime by the LilyGo_AMOLED library.
[env:tdisplay-s3-amoled]
platform = espressif32@6.12.0
board = lilygo-t-display-s3
framework = arduino
monitor_speed = 115200
upload_speed = 921600
board_build.filesystem = spiffs
board_build.partitions = default_16MB.csv
board_build.arduino.memory_type = qio_opi

lib_deps =
    https://github.com/Xinyuan-LilyGO/LilyGo-AMOLED-Series.git
    bodmer/TFT_eSPI@^2.5.31
    bblanchon/ArduinoJson@^7.0.0
    lewisxhe/XPowersLib@^0.2.7
    lewisxhe/SensorLib@^0.2.4

build_flags =
    -DBOARD_TDISPLAY_S3_AMOLED
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1
    -DARDUINO_RUNNING_CORE=1
    -DARDUINO_EVENT_RUNNING_CORE=1
    -DLILYGO_TDISPLAY_AMOLED_SERIES
    -DDISABLE_ALL_LIBRARY_WARNINGS
    -DCORE_DEBUG_LEVEL=1

; LilyGo T8 ESP32-S2 (1.14" ST7789 135x240 LCD, same panel as the TTGO T-Display).
; No dedicated PlatformIO board def exists — esp32-s2-saola-1 is the generic S2 base.
; USB is a CH340C UART bridge (not native USB CDC), so ARDUINO_USB_CDC_ON_BOOT is left unset.
; Display wiring uses the broken-out FSPI pins (GPIO33-38); CS/MOSI/SCLK/RST are from the
; schematic, DC=37/BL=33 are the two remaining FSPI pins — all verified on hardware.
[env:t8-s2]
platform = espressif32@6.9.0
board = esp32-s2-saola-1
framework = arduino
monitor_speed = 115200
upload_speed = 460800
board_build.filesystem = spiffs
board_build.partitions = default.csv

lib_deps =
    bodmer/TFT_eSPI@^2.5.0
    bblanchon/ArduinoJson@^7.0.0

build_flags =
    -DBOARD_T8_S2
    -DUSER_SETUP_LOADED
    -DST7789_DRIVER
    -DTFT_WIDTH=135
    -DTFT_HEIGHT=240
    -DTFT_MOSI=35
    -DTFT_SCLK=36
    -DTFT_CS=34
    -DTFT_DC=37
    -DTFT_RST=38
    -DTFT_BL=33
    -DTFT_BACKLIGHT_ON=HIGH
    -DSPI_FREQUENCY=40000000
    -DLOAD_GLCD
    -DLOAD_FONT2
    -DLOAD_FONT4
    -DLOAD_GFXFF
    -DCORE_DEBUG_LEVEL=1

; Elecrow CrowPanel Advance 3.5" HMI (ESP32-S3-WROOM-1 N16R8, 480x320 IPS).
; Display is an ILI9488 over SPI; capacitive touch is a GT911 on I2C (SDA=15, SCL=16).
; No dedicated PlatformIO board def — esp32-s3-devkitc-1 is the generic S3 base.
; USB is a CH340K UART bridge (not native USB CDC), so ARDUINO_USB_CDC_ON_BOOT is unset.
; Pins are from Elecrow's official LovyanGFX driver (verified on hardware).
[env:crowpanel-adv-35]
platform = espressif32@6.9.0
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
upload_speed = 460800
board_build.flash_size = 16MB
board_upload.flash_size = 16MB
board_build.filesystem = spiffs
board_build.partitions = default.csv
board_build.arduino.memory_type = qio_opi   ; N16R8 module: QIO flash + OPI PSRAM (for the dashboard framebuffer)

lib_deps =
    bodmer/TFT_eSPI@^2.5.0
    bblanchon/ArduinoJson@^7.0.0
    https://github.com/TAMCTec/gt911-arduino.git

build_flags =
    -DBOARD_CROWPANEL_ADV_35
    -DBOARD_HAS_PSRAM
    -DUSER_SETUP_LOADED
    -DUSE_HSPI_PORT
    -DILI9488_DRIVER
    -DTFT_WIDTH=320
    -DTFT_HEIGHT=480
    -DTFT_MISO=-1
    -DTFT_MOSI=39
    -DTFT_SCLK=42
    -DTFT_CS=40
    -DTFT_DC=41
    -DTFT_RST=2
    -DTFT_BL=38
    -DTFT_BACKLIGHT_ON=HIGH
    -DSPI_FREQUENCY=40000000
    -DSPI_READ_FREQUENCY=16000000
    -DLOAD_GLCD
    -DLOAD_FONT2
    -DLOAD_FONT4
    -DLOAD_GFXFF
    -DCORE_DEBUG_LEVEL=1

; Elecrow CrowPanel ESP32 Display 3.5" HMI — the basic (non-Advance) model, DIS05035H.
; Classic ESP32-WROVER-B (4 MB usable PSRAM for the dashboard sprite), same 480x320 ILI9488
; panel as the Advance but resistive XPT2046 touch on the display's SPI bus. USB is a CH340
; UART bridge. Pins from Elecrow's wiki User_Setup.h, except MISO/TOUCH_CS: 33/12, swapped vs
; the wiki's 12/33 (verified on hardware — with 12/33 touch reads nothing; v2.2 owners report
; the same). The panel needs HSPI — it stays white on VSPI.
; 4 MB flash layout so it also fits units that ship with 4 MB (the app is ~1 MB).
[env:crowpanel-35]
platform = espressif32@6.9.0
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 460800
board_upload.flash_size = 4MB
board_build.filesystem = spiffs
board_build.partitions = default.csv

lib_deps =
    bodmer/TFT_eSPI@^2.5.0
    bblanchon/ArduinoJson@^7.0.0

build_flags =
    -DBOARD_CROWPANEL_35
    -DMANGO_UI
    -DBOARD_HAS_PSRAM
    -mfix-esp32-psram-cache-issue
    -DUSER_SETUP_LOADED
    -DUSE_HSPI_PORT
    -DILI9488_DRIVER
    -DTFT_WIDTH=320
    -DTFT_HEIGHT=480
    -DTFT_MISO=33
    -DTFT_MOSI=13
    -DTFT_SCLK=14
    -DTFT_CS=15
    -DTFT_DC=2
    -DTFT_RST=-1
    -DTFT_BL=27
    -DTFT_BACKLIGHT_ON=HIGH
    -DTOUCH_CS=12
    -DSPI_FREQUENCY=27000000
    -DSPI_READ_FREQUENCY=16000000
    -DSPI_TOUCH_FREQUENCY=2500000
    -DLOAD_GLCD
    -DLOAD_FONT2
    -DLOAD_FONT4
    -DLOAD_GFXFF
    -DCORE_DEBUG_LEVEL=1

; Guition/stemedu JC3248W535C_I "Mini ESP32-S3 3.5\"" (ESP32-S3-WROOM-1 N16R8, 320x480
; portrait native, 480x320 landscape IPS touch). Display is an AXS15231B over QSPI;
; capacitive touch is the same AXS15231B controller on I2C (SDA=4, SCL=8, addr 0x3B).
; TFT_eSPI cannot drive this panel, so it is used purely as an in-memory TFT_eSprite
; canvas (see hal.cpp) — no USER_SETUP_LOADED, no *_DRIVER, no TFT_* pin defines.
; Pixels are pushed to the panel via Arduino_GFX (moononournation/GFX Library).
; Pin map and the rotation=0-native / software-rotate-in-flush scheme are lifted from
; benevid/claude-usage-stick-SVGL's firmware/claude_stick (hardware-validated on this
; same module; see wiki/Mini-ESP32-S3-35.md).
[env:mini-s3-35]
platform = espressif32@6.9.0
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
upload_speed = 460800
board_build.flash_size = 16MB
board_upload.flash_size = 16MB
board_build.filesystem = spiffs
board_build.partitions = default_16MB.csv
board_build.arduino.memory_type = qio_opi

; GFX Library is vendored locally at lib/GFX_Library_for_Arduino/ (v1.6.0, not pulled
; via lib_deps) with one file patched — see that file and README.md's Hardware
; Adaptation Notes for why:
;   - v1.6.1+ has a known AXS15231B QSPI init regression on this exact panel (Guition
;     JC3248W535) — see moononournation/Arduino_GFX#803 — that produces a garbled/static
;     display; v1.6.0 is the community-verified last-good version. (v1.6.2+ separately
;     also pulls in esp32-hal-periman.h / esp_private/periph_ctrl.h, ESP-IDF 5.x-only
;     headers this platform's Arduino-ESP32 2.0.17 core doesn't have, so it wouldn't even
;     compile here — v1.6.0 predates that too.)
;   - PlatformIO compiles every .cpp in the library (not just the QSPI databus and
;     AXS15231B driver this port actually uses), and databus/Arduino_ESP32RGBPanel.cpp —
;     for an ESP32-S3 RGB-parallel panel interface this board doesn't have — reaches into
;     an ESP-IDF-private struct this framework version doesn't expose. That one function
;     is stubbed in the vendored copy.
lib_deps =
    bodmer/TFT_eSPI@^2.5.31
    bblanchon/ArduinoJson@^7.0.0

build_flags =
    -DBOARD_MINI_S3_35
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1
    -DDISABLE_ALL_LIBRARY_WARNINGS
    -DCORE_DEBUG_LEVEL=1
    -DMANGO_UI

; Bring-up sketch for the board above — I2C scan, QSPI color bars, raw touch
; coordinates. Exists to fail loudly on a wrong pin before it becomes a blank
; screen in the full firmware. Not part of the normal build matrix; run with
; `pio run -e mini-s3-35-bringup -t upload`. See bringup/mini-s3-35/main.cpp.
[env:mini-s3-35-bringup]
extends = env:mini-s3-35
build_src_filter = -<*> +<../bringup/mini-s3-35/main.cpp>
; -I src: reuses src/touch_axs15231b.h so the bring-up sketch and the real
; firmware share one copy of the touch driver instead of a forked duplicate.
build_flags = ${env:mini-s3-35.build_flags} -I src
